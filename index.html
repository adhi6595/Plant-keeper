<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plant Keeper</title>
<meta name="theme-color" content="#1e6a44">
<meta name="description" content="Care reminders, journal and health history for your plants.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  /* layout: one-column phone app; sticky header, fixed bottom tab bar, plant detail opens as a bottom sheet */
  --bg:#edf1ec;
  --surface:#ffffff;
  --ink:#17231b;
  --muted:#5a6a60;
  --line:#d6dfd8;
  --accent:#1e6a44;
  --accent-ink:#ffffff;
  --accent-soft:#dcefe2;
  --water:#1d5c94; --water-soft:#dce9f5;
  --feed:#985200; --feed-soft:#f8ead5;
  --bad:#b0281f; --bad-soft:#f8dfdc;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101612; --surface:#18211b; --ink:#e6eee8; --muted:#9aaba0; --line:#2b3a30;
    --accent:#5cc28b; --accent-ink:#08170e; --accent-soft:#1d3527;
    --water:#7db6ea; --water-soft:#18293a; --feed:#e9a54f; --feed-soft:#33260f;
    --bad:#f08a80; --bad-soft:#3a1d1a; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101612; --surface:#18211b; --ink:#e6eee8; --muted:#9aaba0; --line:#2b3a30;
  --accent:#5cc28b; --accent-ink:#08170e; --accent-soft:#1d3527;
  --water:#7db6ea; --water-soft:#18293a; --feed:#e9a54f; --feed-soft:#33260f;
  --bad:#f08a80; --bad-soft:#3a1d1a; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.5rem}
h2{font-size:1.2rem}
h3{font-size:1rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:12px}
header.top .season{font-size:.8rem;color:var(--muted);text-align:right}

main{padding:16px 0 104px}
main .wrap{display:flex;flex-direction:column;gap:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:.875rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

label.f{display:flex;flex-direction:column;gap:4px;font-size:.875rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-weight:400;color:var(--ink);width:100%}
textarea{min-height:72px;resize:vertical}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.water{background:var(--water-soft);color:var(--water)}
.pill.feed{background:var(--feed-soft);color:var(--feed)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.stat.alert b{color:var(--bad)}

.task{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0;padding-top:0}
.task .what{font-weight:600}
.task .acts{display:flex;gap:6px}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--accent-soft);display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--accent);font-size:1.1rem;overflow:hidden;border:0;padding:0;cursor:pointer}
.stripe{border-left:4px solid var(--accent);padding-left:8px}
.stripe.water{border-color:var(--water)}
.stripe.feed{border-color:var(--feed)}
.late{color:var(--bad);font-weight:600}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.pcard .ph{aspect-ratio:4/3;background:var(--accent-soft);display:grid;place-items:center;font-family:var(--display);font-size:2.4rem;color:var(--accent);font-weight:700}
.pcard .ph img{width:100%;height:100%;object-fit:cover}
.pcard .bd{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pcard .nm{font-weight:700}
.pcard .loc{font-size:.8rem;color:var(--muted)}

.drop{border:2px dashed var(--line);border-radius:14px;padding:20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.drop img{max-height:280px;border-radius:10px}
.filebtn{position:relative;overflow:hidden;flex-shrink:0}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

.match{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:transparent;text-align:left;width:100%}
.match.on{border-color:var(--accent);background:var(--accent-soft)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent)}
.sci{font-style:italic;color:var(--muted);font-size:.875rem}

dl.care{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:.925rem}
dl.care dt{color:var(--muted);font-weight:600}
dl.care dd{margin:0}
ul.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

.issue{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}

.log{display:flex;flex-direction:column;gap:10px}
.log .ent{display:grid;grid-template-columns:76px 1fr;gap:10px;font-size:.925rem}
.log .ent .d{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.8rem;padding-top:2px}
.log .ent img{border-radius:10px;margin-top:6px;max-height:220px}

.answer{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:12px;font-size:.95rem}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}

.scrim{position:fixed;inset:0;background:rgba(10,20,14,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:0 0 32px}
.sheet .sh-head{position:sticky;top:0;background:var(--bg);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);z-index:2}
.sheet .sh-body{padding:16px;display:flex;flex-direction:column;gap:14px}
.cover{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:14px;background:var(--accent-soft)}
.cover.empty{display:grid;place-items:center;font-family:var(--display);font-size:3rem;color:var(--accent)}

.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:20;max-width:90%}
.notice{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--water);border-radius:12px;padding:12px 14px;font-size:.9rem}
.empty{color:var(--muted);text-align:center;padding:20px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

header.top{padding-top:env(safe-area-inset-top)}
header.top .wrap{align-items:center}
.hdr-r{display:flex;align-items:center;gap:10px}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn svg{width:22px;height:22px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:inherit}
a.btn.primary{color:var(--accent-ink)}
ol.howto{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.paste{display:flex;flex-direction:column;gap:8px}
.ok{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<script src="logic.js"></script>
<script>
(function(){
"use strict";
const {today, parse, addDays, dayDiff, season, TASK, tLabel, waterEvery, every, dueOf, store} = PK;
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt = s => { const d = parse(s); return d.getDate()+" "+MONTHS[d.getMonth()]; };
const fmtY = s => { const d = parse(s); return d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear(); };
const days = n => n+(n===1?" day":" days");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const clone = o => JSON.parse(JSON.stringify(o));
const SETTINGS = {"outdoor-pot":"Outdoor pot","ground":"In the garden","indoor":"Indoors"};
const tCls = t => (TASK[t.type]||TASK.custom).cls;
const CLAUDE_VERSION = "https://claude.ai/artifact/Xtnnm6saG3i6Zo1VURKE3z";
const claudeLink = q => "https://claude.ai/new?q=" + encodeURIComponent(q);

/* ---------- built-in care library (used when adding by name) ---------- */
/* [names, species, waterSummerDays, waterWinterDays, light, feedEveryDays, mistEveryDays, toxicity, difficulty] */
const LIB = [
 [["rose"],"Rosa hybrid",2,7,"Full sun, 6+ hours",90,0,"Not toxic; thorns","moderate"],
 [["tulasi","tulsi","holy basil"],"Ocimum tenuiflorum",2,5,"Full sun to bright light",21,0,"Safe for pets and children","easy"],
 [["basil","sweet basil"],"Ocimum basilicum",2,4,"Full sun",21,0,"Safe for pets and children","easy"],
 [["curry leaf","curry tree","kadi patta","karuveppilai"],"Murraya koenigii",3,10,"Full sun, sheltered from cold wind",30,0,"Safe for people; keep pets from chewing","moderate"],
 [["mint"],"Mentha",2,5,"Part shade to sun",30,0,"Mildly toxic to cats and dogs","easy"],
 [["coriander","cilantro"],"Coriandrum sativum",2,4,"Sun, afternoon shade in summer",21,0,"Safe","easy"],
 [["chilli","chili","capsicum","pepper"],"Capsicum annuum",2,6,"Full sun, warm spot",14,0,"Leaves mildly toxic to pets","easy"],
 [["tomato"],"Solanum lycopersicum",1,5,"Full sun",14,0,"Leaves toxic to pets","moderate"],
 [["curry","drumstick","moringa"],"Moringa oleifera",3,14,"Full sun, warm",30,0,"Safe","moderate"],
 [["lemon","lime","citrus","mandarin","orange"],"Citrus",3,10,"Full sun, sheltered",42,0,"Mildly toxic to pets","moderate"],
 [["jasmine","malli","mogra"],"Jasminum sambac",3,10,"Full sun",30,0,"Not toxic","moderate"],
 [["hibiscus"],"Hibiscus rosa-sinensis",2,8,"Full sun",21,0,"Not toxic","moderate"],
 [["bougainvillea"],"Bougainvillea",4,14,"Full sun",30,0,"Mildly toxic; thorns","easy"],
 [["aloe","aloe vera"],"Aloe vera",10,21,"Bright light to sun",0,0,"Toxic to cats and dogs","easy"],
 [["succulent","echeveria","jade"],"Succulent",10,21,"Bright light to sun",60,0,"Jade is toxic to pets","easy"],
 [["lavender"],"Lavandula",5,14,"Full sun",0,0,"Mildly toxic to pets","easy"],
 [["rosemary"],"Salvia rosmarinus",5,14,"Full sun",60,0,"Safe","easy"],
 [["strawberry"],"Fragaria",2,7,"Full sun",21,0,"Safe","easy"],
 [["hydrangea"],"Hydrangea macrophylla",2,7,"Morning sun, afternoon shade",42,0,"Toxic to pets","moderate"],
 [["gardenia"],"Gardenia jasminoides",3,8,"Bright, morning sun",30,0,"Mildly toxic to pets","hard"],
 [["monstera","swiss cheese"],"Monstera deliciosa",7,14,"Bright indirect light",30,7,"Toxic to pets","easy"],
 [["peace lily","spathiphyllum"],"Spathiphyllum",5,10,"Medium to bright indirect light",30,7,"Toxic to pets","easy"],
 [["snake plant","sansevieria","mother in law"],"Dracaena trifasciata",14,28,"Low to bright indirect light",60,0,"Toxic to pets","easy"],
 [["pothos","money plant","devil's ivy"],"Epipremnum aureum",7,14,"Low to bright indirect light",30,0,"Toxic to pets","easy"],
 [["orchid","phalaenopsis"],"Phalaenopsis",7,12,"Bright indirect light",14,7,"Not toxic","moderate"],
 [["fiddle leaf","fiddle leaf fig"],"Ficus lyrata",7,14,"Bright indirect light",30,0,"Toxic to pets","hard"],
 [["zz plant","zamioculcas"],"Zamioculcas zamiifolia",14,28,"Low to bright indirect light",60,0,"Toxic to pets","easy"],
 [["spider plant"],"Chlorophytum comosum",5,12,"Bright indirect light",30,0,"Safe for pets","easy"],
 [["fern","boston fern"],"Nephrolepis exaltata",3,7,"Indirect light",30,3,"Safe for pets","moderate"],
 [["marigold"],"Tagetes",2,5,"Full sun",21,0,"Mildly toxic to pets","easy"],
 [["lily","peace"],"Lilium",3,10,"Sun to part shade",30,0,"Highly toxic to cats","moderate"]
];
function libFind(name){
  const n = name.toLowerCase().trim();
  let best = null;
  for (const e of LIB) for (const a of e[0]) { if (n === a) return e; if (!best && (n.includes(a) || a.includes(n))) best = e; }
  return best;
}
function libCare(e){
  return {waterSummerDays:e[2], waterWinterDays:e[3], light:e[4], feedEveryDays:e[5], mistEveryDays:e[6], toxicity:e[7], difficulty:e[8]};
}

/* ---------- state ---------- */
let plants = [], meta = {}, ready = false, loadErr = "";
const TABS = ["today","plants","identify","health"];
let tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "today";
let sheet = null;          // {kind:"plant"|"add"|"confirm"|"settings", id}
let toastMsg = "", toastTimer = null;
const idS = {hint:"", setting:"outdoor-pot", paste:"", parsed:null, err:"", loc:"", photo:null};
const hcS = {plantId:"", symptoms:"", paste:"", res:null, err:"", savedFor:"", photo:null};
const addS = {photo:null, journal:null};
const careS = {};           // plantId -> {err, open}
const photoCache = {};
let installEvt = null;

function toast(m){ toastMsg = m; clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ toastMsg=""; render(); }, 3200); render(); }

/* ---------- storage ---------- */
let saving = Promise.resolve();
function persist(){
  const snap = clone(plants);
  saving = saving.then(() => store.set("plants", snap)).catch(() => toast("Couldn't save on this phone. Check storage space."));
  return saving;
}
function savePlant(p){
  if (p.log && p.log.length > 120) p.log = p.log.slice(0,120);
  const i = plants.findIndex(x => x.id === p.id);
  if (i >= 0) plants[i] = clone(p); else plants.push(clone(p));
  render();
  return persist();
}
const getPlant = id => { const p = plants.find(x => x.id === id); return p ? clone(p) : null; };
function addLog(p, text, extra){ p.log = p.log || []; p.log.unshift(Object.assign({d: today(), t: text}, extra||{})); }
async function loadPhotos(pid, force){
  if (photoCache[pid] && !force) return;
  photoCache[pid] = "loading";
  try { photoCache[pid] = await store.photosFor(pid); } catch(e){ photoCache[pid] = []; }
  render();
}

/* ---------- images ---------- */
async function readImg(file){
  const url = URL.createObjectURL(file);
  const img = new Image(); img.src = url;
  try { await img.decode(); } catch(e){ throw new Error("That photo couldn't be opened. Try a JPG or PNG."); }
  return img;
}
function scaledURL(img, max, q){
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", q);
}

/* ---------- Claude prompts and paste-back ---------- */
const CARE_JSON = '"care":{"waterSummerDays":3,"waterWinterDays":10,"light":"","feedEveryDays":30,"feedTip":"","mistEveryDays":0,"humidity":"","temperature":"","soil":"","toxicity":"","difficulty":"easy|moderate|hard","tips":["","",""]}';
const CARE_RULE = "Watering days = typical days between waterings in that setting. Use 0 when feeding or misting isn't needed.";
function where(){ return "I live in Auckland, New Zealand. Today is "+fmtY(today())+" ("+season().toLowerCase()+")."; }
function plantCtx(p){
  const recent = (p.log||[]).slice(0,6).map(l => l.d+": "+l.t).join("; ");
  return "My "+p.name+(p.species?" ("+p.species+")":"")+" is "+(SETTINGS[p.setting]||"in a pot").toLowerCase()+(p.location?", "+p.location:"")+"."+(recent?" Recent notes: "+recent+".":"");
}
function identifyPrompt(){
  return "I'm attaching a photo of a plant. "+where()+" It's going to be "+(SETTINGS[idS.setting]||"in a pot").toLowerCase()+"."+(idS.hint?" What I know: "+idS.hint+".":"")+
    "\n\nPlease identify it: your top 3 matches and how confident you are, then how to care for it here."+
    "\n\nAt the very end, add one code block containing only this JSON, filled in for your best match, so I can paste it into my Plant Keeper app:\n"+
    '{"plantkeeper":"plant","name":"","species":"",'+CARE_JSON+'}\n'+CARE_RULE;
}
function healthPrompt(p){
  return "I'm attaching a photo of "+(p ? "my plant. "+plantCtx(p) : "a plant.")+" "+where()+(hcS.symptoms?" What I've noticed: "+hcS.symptoms+".":"")+
    "\n\nPlease check its health: what's most likely wrong, how sure you are, and step-by-step treatment with products I can buy in NZ."+
    "\n\nAt the very end, add one code block containing only this JSON, so I can paste it into my Plant Keeper app:\n"+
    '{"plantkeeper":"health","overall":"healthy|minor|needs-attention|serious","summary":"one or two sentences","issues":[{"name":"","likelihood":"likely|possible","treatment":["step"]}],"careChanges":[""],"followUpDays":7}';
}
function carePrompt(p){
  return plantCtx(p)+" "+where()+"\n\nPlease give me a care guide for it here."+
    "\n\nAt the very end, add one code block containing only this JSON, so I can paste it into my Plant Keeper app:\n"+
    '{"plantkeeper":"care","name":"'+p.name.replace(/"/g,"")+'","species":"",'+CARE_JSON+'}\n'+CARE_RULE;
}
function askPrompt(p, q){ return plantCtx(p)+" "+where()+"\n\n"+q; }

function parseClaude(text){
  const blocks = [];
  const re = /```[a-zA-Z]*\s*([\s\S]*?)```/g; let m;
  while ((m = re.exec(text))) blocks.push(m[1]);
  blocks.push(text);
  for (const b of blocks){
    const a = b.indexOf("{"), z = b.lastIndexOf("}");
    if (a < 0 || z < a) continue;
    try { const v = JSON.parse(b.slice(a, z+1)); if (v && typeof v === "object") return v; } catch(e){}
  }
  throw new Error("No Plant Keeper data found. Copy Claude's whole reply, or just the code block at the end.");
}
async function clipboardText(){
  try { return await navigator.clipboard.readText(); } catch(e){ return null; }
}

/* ---------- plant building ---------- */
function makePlant(o){
  const c = o.care || {};
  const t = today();
  const tasks = [{id:uid("t"), type:"water", auto:true, last:null, due:t}];
  if (+c.feedEveryDays > 0) tasks.push({id:uid("t"), type:"feed", every:+c.feedEveryDays, last:null, due:addDays(t,7)});
  if (+c.mistEveryDays > 0) tasks.push({id:uid("t"), type:"mist", every:+c.mistEveryDays, last:null, due:t});
  tasks.push({id:uid("t"), type:"check", every:14, last:null, due:addDays(t,7)});
  return { id: uid("p"), name: o.name, species: o.species||"", location: o.location||"", setting: o.setting||"outdoor-pot",
    added: t, notes: o.notes||"", cover: o.cover||"", care: c, tasks, log: [{d:t, t: o.logText || "Added to my plants"}] };
}

/* ---------- actions ---------- */
function doneTask(pid, tid){
  const p = getPlant(pid); if (!p) return;
  const t = (p.tasks||[]).find(x => x.id === tid); if (!t) return;
  const verb = t.type === "custom" ? "Done: "+tLabel(t) : (TASK[t.type]||TASK.custom).verb + (t.label ? " ("+t.label+")" : "");
  if (every(t,p) === 0) p.tasks = p.tasks.filter(x => x.id !== tid);
  else { t.last = today(); delete t.snooze; }
  addLog(p, verb); savePlant(p); toast(verb+" · "+p.name);
}
function laterTask(pid, tid){
  const p = getPlant(pid); if (!p) return;
  const t = p.tasks.find(x => x.id === tid); if (!t) return;
  t.snooze = addDays(today(),1); savePlant(p); toast("Moved to tomorrow");
}
function rained(){
  let n = 0;
  for (const src of plants){
    if (src.setting === "indoor") continue;
    const p = clone(src);
    const t = (p.tasks||[]).find(x => x.type === "water");
    if (!t || dueOf(t,p) > addDays(today(),1)) continue;
    t.last = today(); delete t.snooze; addLog(p, "Rain counted as watering");
    const i = plants.findIndex(x => x.id === p.id); plants[i] = p; n++;
  }
  persist(); toast(n ? "Watering skipped for "+n+" outdoor plant"+(n>1?"s":"") : "No outdoor plants need water yet");
}

/* ---------- calendar ---------- */
const icsDate = s => s.replace(/-/g,"");
function gcalLink(t, p){
  const d = dueOf(t,p) < today() ? today() : dueOf(t,p);
  const n = every(t,p);
  const u = new URL("https://calendar.google.com/calendar/render");
  u.searchParams.set("action","TEMPLATE");
  u.searchParams.set("text", tLabel(t)+" · "+p.name);
  u.searchParams.set("dates", icsDate(d)+"T080000/"+icsDate(d)+"T081500");
  u.searchParams.set("ctz","Pacific/Auckland");
  u.searchParams.set("details","Plant Keeper reminder for "+p.name+(t.type==="water"&&t.auto?". Interval follows the season; re-add it when the season changes.":""));
  if (n > 0) u.searchParams.set("recur","RRULE:FREQ=DAILY;INTERVAL="+n);
  return u.toString();
}
function buildIcs(){
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Plant Keeper//EN","CALSCALE:GREGORIAN","X-WR-CALNAME:Plant Keeper"];
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  for (const p of plants) for (const t of (p.tasks||[])){
    const d = dueOf(t,p) < today() ? today() : dueOf(t,p);
    const n = every(t,p);
    L.push("BEGIN:VEVENT","UID:"+t.id+"-"+p.id+"@plant-keeper","DTSTAMP:"+stamp,
      "DTSTART;TZID=Pacific/Auckland:"+icsDate(d)+"T080000","DURATION:PT15M",
      "SUMMARY:"+(tLabel(t)+" · "+p.name).replace(/[,;]/g," "));
    if (n > 0) L.push("RRULE:FREQ=DAILY;INTERVAL="+n);
    L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+(tLabel(t)+" "+p.name).replace(/[,;]/g," "),"TRIGGER:PT0M","END:VALARM","END:VEVENT");
  }
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}
function download(name, text, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

/* ---------- reminders ---------- */
async function enableReminders(){
  if (!("Notification" in window)){ toast("This browser can't show notifications. Use the calendar option."); return; }
  const perm = await Notification.requestPermission();
  if (perm !== "granted"){ toast("Notifications are blocked. Allow them in your phone's settings for this app."); render(); return; }
  const reg = await navigator.serviceWorker.ready;
  let bg = false;
  try {
    if ("periodicSync" in reg){
      const st = await navigator.permissions.query({name:"periodic-background-sync"});
      if (st.state === "granted"){ await reg.periodicSync.register("plant-check", {minInterval: 12*60*60*1000}); bg = true; }
    }
  } catch(e){}
  meta.remindersOn = true; meta.bgSync = bg; await store.set("meta", Object.assign((await store.get("meta"))||{}, {remindersOn:true, bgSync:bg}));
  if (reg.active) reg.active.postMessage({type:"remind", force:true});
  toast(bg ? "Reminders on. You'll get a daily alert when tasks are due." : "Reminders on. You'll get an alert when you open the app on a day with tasks.");
  render();
}

function dueText(d){
  const n = dayDiff(d, today());
  if (n < 0) return '<span class="late">'+days(-n)+" overdue</span>";
  if (n === 0) return "Due today";
  if (n === 1) return "Tomorrow";
  return "In "+n+" days · "+fmt(d);
}
function nextTask(p){
  let best = null;
  for (const t of (p.tasks||[])) { const d = dueOf(t,p); if (!best || d < best.d) best = {t, d}; }
  return best;
}

function careList(c, p){
  if (!c) return "";
  const rows = [];

  if (c.light) rows.push(["Light", c.light]);
  if (+c.feedEveryDays) rows.push(["Feed", "Every "+c.feedEveryDays+" days"+(c.feedTip?". "+c.feedTip:"")]);
  else if (c.feedTip) rows.push(["Feed", c.feedTip]);
  if (+c.mistEveryDays) rows.push(["Mist", "Every "+c.mistEveryDays+" days"]);
  if (c.humidity) rows.push(["Humidity", c.humidity]);
  if (c.temperature) rows.push(["Temperature", c.temperature]);
  if (c.soil) rows.push(["Soil", c.soil]);
  if (c.toxicity) rows.push(["Safety", c.toxicity]);
  if (c.difficulty) rows.push(["Difficulty", c.difficulty]);
  let h = '<dl class="care">'+rows.map(r => '<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>').join("")+'</dl>';

  if (tips.length) h += '<ul class="tips">'+tips.map(t => '<li>'+esc(t)+'</li>').join("")+'</ul>';
  return h;
}

    '<div class="row"><span class="btn sm filebtn">'+(addS.journal&&addS.journal.pid===p.id?"Photo added":"Add photo")+'<input type="file" accept="image/*" data-jphoto="'+p.id+'" aria-label="Journal photo"></span>'+
    '<button class="btn sm primary" data-act="note" data-id="'+p.id+'">Save entry</button></div><div class="log">';
  for (const l of (p.log||[])){
    const ph = l.photo ? byId[l.photo] : null;
    h += '<div class="ent"><span class="d">'+fmtY(l.d)+'</span><div>'+esc(l.t)+(ph?'<img src="'+ph.img+'" alt="">':'')+'</div></div>';
  }
  h += '</div></section><button class="btn danger" data-act="ask-delete" data-id="'+p.id+'">Delete plant</button></div>';
  return h;
}
function sheetAdd(){
  return '<div class="sh-head"><h2>Add a plant</h2><button class="btn sm ghost" data-act="close">Close</button></div><div class="sh-body">'+
    '<p class="small muted">Common plants get a care guide straight away. For anything else, update the guide with Claude from the plant\'s page.</p>'+
    '<label class="f">Plant name<input type="text" id="ad-name" placeholder="e.g. Curry leaf, Monstera, Lemon tree"></label>'+
    '<label class="f">Where is it?<input type="text" id="ad-loc" placeholder="e.g. Deck, kitchen window"></label>'+
    '<label class="f">Setting<select id="ad-set">'+Object.entries(SETTINGS).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join("")+'</select></label>'+
    '<label class="f">Notes (optional)<input type="text" id="ad-notes" placeholder="e.g. grown from seed"></label>'+
    '<span class="btn filebtn">'+(addS.photo?"Photo added":"Add a photo (optional)")+'<input type="file" accept="image/*" id="ad-photo"></span>'+
    '<button class="btn primary" data-act="ad-save">Add plant</button>'+
    '<button class="btn ghost" data-act="tab" data-tab="identify">Don\'t know the name? Identify with Claude</button></div>';
}
function sheetConfirm(p){
  return '<div class="sh-head"><h2>Delete '+esc(p.name)+'?</h2><button class="btn sm ghost" data-act="close">Cancel</button></div><div class="sh-body">'+
    '<p>This removes the plant, its schedule and its journal photos from this phone. It can\'t be undone.</p>'+
    '<div class="row"><button class="btn" data-act="open" data-id="'+p.id+'">Keep it</button><button class="btn danger" data-act="delete" data-id="'+p.id+'">Delete</button></div></div>';
}
function sheetSettings(){
  const perm = ("Notification" in window) ? Notification.permission : "unsupported";
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  let h = '<div class="sh-head"><h2>Settings</h2><button class="btn sm ghost" data-act="close">Close</button></div><div class="sh-body">';
  if (!standalone) h += '<section class="card"><h3>Install on your phone</h3><p class="small">'+(installEvt?'Add Plant Keeper to your home screen so it opens like an app.':'In Chrome, tap the ⋮ menu, then <b>Add to Home screen</b> or <b>Install app</b>. On iPhone, tap Share, then <b>Add to Home Screen</b>.')+'</p>'+(installEvt?'<button class="btn primary" data-act="install">Install app</button>':'')+'</section>';
  h += '<section class="card"><h3>Reminders</h3>';
  if (perm === "granted" && meta.remindersOn) h += '<p class="small ok">Notifications are on.</p><p class="small">'+(meta.bgSync?'Your phone checks about once a day and alerts you when tasks are due. Android decides the exact time.':'You\'ll get an alert when you open the app on a day with tasks. For alerts at a set time, add the tasks to your calendar below.')+'</p><button class="btn sm" data-act="test-note">Send a test alert</button>';
  else if (perm === "denied") h += '<p class="small">Notifications are blocked. Allow them for Plant Keeper in your phone\'s Settings → Apps → Notifications.</p>';
  else if (perm === "unsupported") h += '<p class="small">This browser can\'t show notifications. Install the app first, or use the calendar option below.</p>';
  else h += '<p class="small">Get an alert on days when your plants need something.</p><button class="btn primary" data-act="enable-rem">Turn on reminders</button>';
  h += '<h3>Calendar alerts</h3><p class="small">For alerts at 8 am that always arrive, add your tasks to your phone calendar. Do this again when you add plants or the season changes.</p>'+
    '<button class="btn" data-act="ics">Download all tasks for your calendar (.ics)</button><p class="small muted">Samsung Calendar opens this file directly. For Google Calendar, use <b>Add to calendar</b> on each task in a plant\'s page.</p></section>';
  h += '<section class="card"><h3>Backup</h3><p class="small">Your plants are saved only on this phone. Keep a backup file in case you change phones or clear the browser.</p>'+
    '<div class="row" style="flex-wrap:wrap"><button class="btn" data-act="export">Save backup</button><span class="btn filebtn">Restore from backup<input type="file" accept=".json,application/json" id="import-file"></span></div>'+
    (meta.lastBackup?'<p class="small muted">Last backup '+fmtY(meta.lastBackup)+'</p>':'')+'</section>';
  h += '<section class="card"><h3>About</h3><p class="small">Identify, health checks and questions open Claude, and you paste the reply back here. Everything else works offline.</p><a class="btn sm ghost" target="_blank" rel="noopener" href="'+CLAUDE_VERSION+'">Open the Claude version</a></section>';
  return h + '</div>';
}

/* ---------- main render ---------- */
const app = document.getElementById("app");
function render(){
  const keep = {}; let focusId = null, selS = null, selE = null, sheetScroll = 0;
  app.querySelectorAll("input[id]:not([type=file]),textarea[id],select[id]").forEach(el => keep[el.id] = el.value);
  const ae = document.activeElement;
  if (ae && ae.id && app.contains(ae)) { focusId = ae.id; try { selS = ae.selectionStart; selE = ae.selectionEnd; } catch(e){} }
  const sh = app.querySelector(".sheet"); if (sh) sheetScroll = sh.scrollTop;
  const openDetails = new Set([...app.querySelectorAll("details[id][open]")].map(d => d.id));

  let body;
  if (!ready) body = loadErr ? '<p class="notice" style="border-left-color:var(--bad)">'+esc(loadErr)+'</p>' : '<p class="empty"><span class="spin"></span> Loading…</p>';
  else if (tab === "today") body = viewToday();
  else if (tab === "plants") body = viewPlants();
  else if (tab === "identify") body = viewIdentify();
  else body = viewHealth();

  let sheetHtml = "";
  if (sheet){
    const p = sheet.id ? plants.find(x => x.id === sheet.id) : null;
    if (sheet.kind === "add") sheetHtml = sheetAdd();
    else if (sheet.kind === "settings") sheetHtml = sheetSettings();
    else if (p && sheet.kind === "plant") sheetHtml = sheetPlant(p);
    else if (p && sheet.kind === "confirm") sheetHtml = sheetConfirm(p);
    else sheet = null;
  }
  app.innerHTML =
    '<header class="top"><div class="wrap"><h1>Plant Keeper</h1><div class="hdr-r"><div class="season">'+season()+' in Auckland<br>'+fmtY(today())+'</div><button class="iconbtn" data-act="settings" aria-label="Settings">'+ICON.gear+'</button></div></div></header>'+
    '<main><div class="wrap">'+body+'</div></main>'+
    '<nav class="tabs" aria-label="Sections"><div class="wrap">'+TABS.map(k => '<button class="'+(k===tab?"on":"")+'" data-act="tab" data-tab="'+k+'" aria-current="'+(k===tab?"page":"false")+'">'+ICON[k]+TABNAME[k]+'</button>').join("")+'</div></nav>'+
    (sheetHtml ? '<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">'+sheetHtml+'</div></div>' : '')+
    (toastMsg ? '<div class="toast" role="status">'+esc(toastMsg)+'</div>' : '');
  document.body.style.overflow = sheetHtml ? "hidden" : "";
  openDetails.forEach(id => { const d = document.getElementById(id); if (d) d.open = true; });
  for (const id in keep){ const el = document.getElementById(id); if (el && el.type !== "file") el.value = keep[id]; }
  const nsh = app.querySelector(".sheet"); if (nsh && sheetScroll) nsh.scrollTop = sheetScroll;
  if (focusId){ const el = document.getElementById(focusId); if (el){ el.focus({preventScroll:true}); try { if (selS != null) el.setSelectionRange(selS, selE); } catch(e){} } }
}

/* ---------- events ---------- */
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
function goTab(t){ tab = t; sheet = null; history.replaceState(null, "", "#"+t); window.scrollTo(0,0); render(); }

app.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id, tid = b.dataset.t;
  if (act === "scrim"){ if (ev.target === b){ sheet = null; render(); } return; }
  if (act === "claude"){ idS.hint = val("id-hint") || idS.hint; hcS.symptoms = val("hc-sym") || hcS.symptoms;
    b.href = claudeLink(b.dataset.kind === "identify" ? identifyPrompt() : healthPrompt(plants.find(x => x.id === hcS.plantId))); return; }
  if (act === "tab") return goTab(b.dataset.tab);
  if (act === "close"){ sheet = null; render(); return; }
  if (act === "settings"){ sheet = {kind:"settings"}; render(); return; }
  if (act === "open"){ sheet = {kind:"plant", id}; render(); loadPhotos(id); return; }
  if (act === "add"){ sheet = {kind:"add"}; addS.photo = null; render(); return; }
  if (act === "done") return doneTask(id, tid);
  if (act === "later") return laterTask(id, tid);
  if (act === "rained") return rained();
  if (act === "ask-delete"){ sheet = {kind:"confirm", id}; render(); return; }
  if (act === "delete") return deletePlant(id);
  if (act === "del-task"){ const p = getPlant(id); p.tasks = p.tasks.filter(t => t.id !== tid); savePlant(p); return; }
  if (act === "manual"){ const p = getPlant(id); const t = p.tasks.find(x=>x.id===tid); t.every = waterEvery(p); t.auto = false; savePlant(p); return; }
  if (act === "auto"){ const p = getPlant(id); const t = p.tasks.find(x=>x.id===tid); t.auto = true; savePlant(p); return; }
  if (act === "add-task") return addTask(id);
  if (act === "note") return addNote(id);
  if (act === "ask"){ const q = val("ask-"+id); const p = getPlant(id); if (!q){ toast("Type your question first."); return; } window.open(claudeLink(askPrompt(p,q)), "_blank", "noopener"); return; }
  if (act === "go-health"){ hcS.plantId = id; hcS.res = null; hcS.savedFor = ""; return goTab("health"); }
  if (act === "clip"){ const tx = await clipboardText(); const el = document.getElementById(b.dataset.target);
    if (tx == null){ toast("Long-press the box and choose Paste."); if (el) el.focus(); return; }
    if (el){ el.value = tx; } return; }
  if (act === "read-id-paste") return readIdentify();
  if (act === "read-hc-paste") return readHealth();
  if (act.startsWith("read-cg-paste-")) return readCare(act.slice("read-cg-paste-".length));
  if (act === "id-add") return addFromId();
  if (act === "ad-save") return addByName();
  if (act === "enable-rem") return enableReminders();
  if (act === "test-note"){ const reg = await navigator.serviceWorker.ready; reg.showNotification("Plant Keeper", {body:"Reminders are working.", icon:"icon-192.png", tag:"test"}); return; }
  if (act === "ics"){ download("plant-keeper-reminders.ics", buildIcs(), "text/calendar"); return; }
  if (act === "export") return exportBackup();
  if (act === "install"){ if (installEvt){ installEvt.prompt(); installEvt = null; render(); } return; }
});
app.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "id-hint") idS.hint = t.value;
  if (t.id === "id-loc") idS.loc = t.value;
  if (t.id === "hc-sym") hcS.symptoms = t.value;
});
app.addEventListener("change", async ev => {
  const t = ev.target;
  if (t.id === "id-set"){ idS.setting = t.value; render(); }
  if (t.id === "hc-plant"){ hcS.plantId = t.value; hcS.savedFor = ""; render(); }
  if (t.dataset.every){
    const n = Math.round(+t.value);
    if (n >= 1){ const p = getPlant(t.dataset.every); const k = p.tasks.find(x=>x.id===t.dataset.t); k.every = n; savePlant(p); }
  }
  if (t.type === "file" && t.files && t.files[0]){
    const f = t.files[0];
    try {
      if (t.id === "import-file") return importBackup(f);
      const img = await readImg(f);
      if (t.id === "ad-photo") addS.photo = scaledURL(img,480,.72);
      else if (t.id === "id-photo") idS.photo = scaledURL(img,480,.72);
      else if (t.id === "hc-photo"){ hcS.photo = scaledURL(img,720,.7); if (hcS.res && hcS.savedFor) await attachHealthPhoto(); }
      else if (t.dataset.cover){ const p = getPlant(t.dataset.cover); p.cover = scaledURL(img,480,.72); await savePlant(p); }
      else if (t.dataset.jphoto) addS.journal = {pid: t.dataset.jphoto, img: scaledURL(img,720,.7)};
      render();
    } catch(e){ toast(e.message || "That photo couldn't be used."); }
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheet){ sheet = null; render(); } });

/* ---------- handlers ---------- */
function readIdentify(){
  idS.err = ""; idS.parsed = null;
  try {
    const v = parseClaude(val("id-paste"));
    if (!v.name) throw new Error("Claude's reply didn't include a plant name. Ask it to add the code block.");
    idS.parsed = v;
  } catch(e){ idS.err = e.message; }
  render();
}
async function addFromId(){
  const r = idS.parsed; if (!r) return;
  const p = makePlant({name:r.name, species:r.species, location:idS.loc, setting:idS.setting, care:r.care||{}, cover:idS.photo||"", logText:"Identified with Claude and added"});
  await savePlant(p);
  Object.assign(idS, {parsed:null, loc:"", hint:"", photo:null});
  const el = document.getElementById("id-paste"); if (el) el.value = "";
  tab = "plants"; history.replaceState(null,"","#plants"); sheet = {kind:"plant", id:p.id};
  toast(p.name+" added");
}
async function addByName(){
  const name = val("ad-name");
  if (!name){ toast("Enter the plant's name."); return; }
  const e = libFind(name);
  const p = makePlant({name, species: e ? e[1] : "", location: val("ad-loc"), setting: val("ad-set") || "outdoor-pot", notes: val("ad-notes"),
    care: e ? libCare(e) : {waterSummerDays:3, waterWinterDays:10}, cover: addS.photo || ""});
  await savePlant(p);
  addS.photo = null; sheet = {kind:"plant", id:p.id}; tab = "plants"; history.replaceState(null,"","#plants");
  toast(p.name+" added"+(e?"":". Update its care guide with Claude for exact watering."));
}
async function readCare(pid){
  const cs = careS[pid] = {err:""};
  try {
    const v = parseClaude(val("cg-paste-"+pid));
    if (!v.care) throw new Error("No care guide found in that reply.");
    const p = getPlant(pid);
    p.care = v.care; if (v.species && !p.species) p.species = v.species;
    if (+v.care.feedEveryDays > 0 && !p.tasks.some(t=>t.type==="feed")) p.tasks.push({id:uid("t"),type:"feed",every:+v.care.feedEveryDays,last:null,due:addDays(today(),7)});
    if (+v.care.mistEveryDays > 0 && !p.tasks.some(t=>t.type==="mist")) p.tasks.push({id:uid("t"),type:"mist",every:+v.care.mistEveryDays,last:null,due:today()});
    addLog(p, "Care guide updated with Claude");
    await savePlant(p); toast("Care guide updated");
    const el = document.getElementById("cg-paste-"+pid); if (el) el.value = "";
  } catch(e){ cs.err = e.message; render(); }
}
async function readHealth(){
  hcS.err = ""; hcS.res = null; hcS.savedFor = "";
  try {
    const v = parseClaude(val("hc-paste"));
    if (!v.overall && !v.summary && !v.issues) throw new Error("No health result found in that reply.");
    hcS.res = v;
    if (hcS.plantId) await saveDiagnosis();
  } catch(e){ hcS.err = e.message; }
  render();
}
async function saveDiagnosis(){
  const r = hcS.res, pid = hcS.plantId; const p = getPlant(pid); if (!r || !p) return;
  let photoId = null;
  if (hcS.photo){ photoId = uid("ph"); await store.putPhoto({id:photoId, plant:pid, d:today(), img:hcS.photo, kind:"check"}); }
  const o = OVERALL[r.overall] || ["Checked"];
  const names = (r.issues||[]).map(i=>i.name).filter(Boolean).join(", ");
  addLog(p, "Health check: "+o[0]+(names?" ("+names+")":"")+". "+(r.summary||""), photoId?{photo:photoId}:null);
  p.lastHealth = {d:today(), overall:r.overall, summary:r.summary||""};
  const chk = (p.tasks||[]).find(t => t.type==="check" && every(t,p) > 0); if (chk){ chk.last = today(); delete chk.snooze; }
  const f = Math.round(+r.followUpDays||0);
  if (f > 0) p.tasks.push({id:uid("t"), type:"check", label:"Re-check health", every:0, last:null, due:addDays(today(), f)});
  await savePlant(p);
  hcS.savedFor = pid; hcS.photo = null; delete photoCache[pid];
  const el = document.getElementById("hc-paste"); if (el) el.value = "";
}
async function attachHealthPhoto(){
  const p = getPlant(hcS.savedFor); if (!p || !hcS.photo) return;
  const entry = (p.log||[]).find(l => l.t.startsWith("Health check")); if (!entry || entry.photo) return;
  const id = uid("ph"); await store.putPhoto({id, plant:p.id, d:today(), img:hcS.photo, kind:"check"});
  entry.photo = id; hcS.photo = null; delete photoCache[p.id]; await savePlant(p); toast("Photo added to the journal");
}
function addTask(pid){
  const p = getPlant(pid); if (!p) return;
  const type = val("nt-type-"+pid) || "custom";
  const label = val("nt-label-"+pid);
  const ev = Math.round(+val("nt-every-"+pid) || 0);
  if (type === "custom" && !label){ toast("Give the task a name."); return; }
  const t = {id:uid("t"), type, every: ev > 0 ? ev : 0, last:null, due: val("nt-date-"+pid) || today()};
  if (label) t.label = label;
  p.tasks = p.tasks || []; p.tasks.push(t); savePlant(p); toast("Task added");
}
async function addNote(pid){
  const text = val("jn-"+pid);
  const ph = addS.journal && addS.journal.pid === pid ? addS.journal.img : null;
  if (!text && !ph){ toast("Write a note or add a photo."); return; }
  const p = getPlant(pid);
  let photoId = null;
  if (ph){ photoId = uid("ph"); await store.putPhoto({id:photoId, plant:pid, d:today(), img:ph, kind:"journal"}); }
  addLog(p, text || "Photo", photoId ? {photo:photoId} : null);
  addS.journal = null;
  const el = document.getElementById("jn-"+pid); if (el) el.value = "";
  await savePlant(p); loadPhotos(pid, true);
}
async function deletePlant(pid){
  sheet = null;
  const name = (plants.find(p=>p.id===pid)||{}).name || "Plant";
  plants = plants.filter(p => p.id !== pid); await persist(); render();
  try { const ph = await store.photosFor(pid); for (const x of ph) await store.delPhoto(x.id); } catch(e){}
  toast(name+" deleted");
}
async function exportBackup(){
  const photos = await store.allPhotos();
  download("plant-keeper-backup-"+today()+".json", JSON.stringify({app:"plant-keeper", version:1, saved:today(), plants, photos}), "application/json");
  meta.lastBackup = today(); await store.set("meta", Object.assign((await store.get("meta"))||{}, {lastBackup:today()})); render();
}
async function importBackup(file){
  try {
    const v = JSON.parse(await file.text());
    if (v.app !== "plant-keeper" || !Array.isArray(v.plants)) throw new Error();
    for (const ph of (v.photos||[])) await store.putPhoto(ph);
    plants = v.plants; await persist();
    for (const k in photoCache) delete photoCache[k];
    sheet = null; toast("Restored "+plants.length+" plants");
  } catch(e){ toast("That isn't a Plant Keeper backup file."); }
